name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source zip
        run: |
          set -e
          Z=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$Z" ] && [ ! -f pubspec.yaml ]; then
            echo "Extracting $Z ..."
            unzip -q -o "$Z" -d src_extracted
          fi

      - name: Find Flutter project folder
        id: proj
        run: |
          set -e
          P=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml missing"
            find . -maxdepth 3 -type f | head -80
            exit 1
          fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Fix missing _pngDot (compile error)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          F=lib/screens/lobby_screen.dart
          if [ -f "$F" ]; then
            sed -i "s/_pngDot(asset: 'assets\/ui\/icon_setting.png', onTap: onSettings)/_dot(icon: Icons.settings_rounded, onTap: onSettings)/g" "$F"
            grep -n "_pngDot\|_dot(icon: Icons.settings" "$F" | head -5 || true
          else
            echo "lobby_screen.dart not found"
          fi

      - name: Placeholder assets (no characters/sfx/ui on upload)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p assets/characters assets/sfx assets/ui
          python3 - <<'PY'
          import os, struct, wave, zlib

          def wav(path, ms=80):
              sr, n = 22050, max(1, int(22050 * ms / 1000))
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with wave.open(path, "w") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes(b"\x00\x00" * n)

          def png(path, w=16, h=16):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              raw = b"".join(b"\x00" + (b"\x00\x00\x00\x00" * w) for _ in range(h))
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "wb").write(data)

          def jpg(path):
              open(path, "wb").write(bytes.fromhex(
                  "ffd8ffe000104a46494600010100000100010000ffdb004300080606070605080707"
                  "070909080a0c140d0c0b0b0c1912130f141d1a1f1e1d1a1c1c20242e2720222c231c"
                  "1c2837292c30313434341f27393d38323c2e333432ffc0000b080001000101011100"
                  "ffc400140001000000000000000000000000000008ffc40014100100000000000000"
                  "0000000000000000ffda0008010100003f007fffd9"
              ))

          for n in ["cut","dice_roll","dice_six","extra_turn","forfeit","home","hop","lose","match_start","miss","no_move","tap","token_open","ui_click","win"]:
              p = f"assets/sfx/{n}.wav"
              if not os.path.isfile(p) or os.path.getsize(p) < 44:
                  wav(p)

          for n in ["booyah_logo.png","lobby_bg.png","rank_crest.png","garena_logo.png","icon_setting.png","icon_mail.png","icon_store.png","icon_close.png","profile_stats_bg.png"]:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p):
                  png(p)

          for n in ["ff_lobby_bg.jpg","ff_loading_bg.jpg","ff_login_bg.jpg","ff_hero_bg.jpg"]:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p):
                  jpg(p)

          if not any(f.endswith(".png") for f in os.listdir("assets/characters")):
              png("assets/characters/Rin.png", 64, 128)

          print("sfx", len(os.listdir("assets/sfx")), "ui", len(os.listdir("assets/ui")), "chars", len(os.listdir("assets/characters")))
          PY

      - name: Fix Gradle wrapper / AGP
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.3-all.zip#; s#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's#id("com.android.application") version "[0-9.]*"#id("com.android.application") version "8.11.1"#' settings.gradle.kts
            sed -i 's#id("org.jetbrains.kotlin.android") version "[0-9.]*"#id("org.jetbrains.kotlin.android") version "2.2.20"#' settings.gradle.kts
          fi

      - name: Flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build arm64-v8a release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Package APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          APK_DIR=build/app/outputs/flutter-apk
          ls -lh "$APK_DIR" || true
          APK="$APK_DIR/app-arm64-v8a-release.apk"
          [ -f "$APK" ] || APK="$APK_DIR/app-release.apk"
          [ -f "$APK" ] || { find build -name "*.apk"; exit 1; }
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/LudoRush.apk"
          ls -lh "$GITHUB_WORKSPACE/LudoRush.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-apk
          path: LudoRush.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ludo Rush APK v1.0.${{ github.run_number }}
          body: arm64-v8a release. Import characters/sfx/ui via MT Manager after install.
          files: LudoRush.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
