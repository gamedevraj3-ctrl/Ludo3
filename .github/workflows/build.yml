name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source zip
        run: |
          set -e
          Z=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -n "$Z" ]; then
            echo "Extracting $Z ..."
            rm -rf src_extracted
            mkdir -p src_extracted
            unzip -q -o "$Z" -d src_extracted
            find src_extracted -maxdepth 3 -type f | head -40
            ls -lh "$Z"
          else
            echo "No zip found — using repo root as project"
          fi

      - name: Find Flutter project folder
        id: proj
        run: |
          set -e
          P=$(find . -maxdepth 5 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml missing"
            find . -maxdepth 4 -type f | head -80
            exit 1
          fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Placeholder assets
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          mkdir -p assets/characters assets/sfx assets/ui/ff_profile assets/ui/ff_lobby assets/ui/dice assets/ui/ff_character assets/ui/user_lobby_screenshots
          python3 - <<'PY'
          import os, struct, zlib, wave

          def wav(path, ms=60):
              sr = 22050
              n = max(1, int(sr * ms / 1000))
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with wave.open(path, "w") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes(b"\x00\x00" * n)

          def png(path, w=32, h=32):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              row = b"\x00" + (b"\x1a\x1d\x22\xff" * w)
              raw = row * h
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "wb").write(data)

          def jpg(path):
              open(path, "wb").write(bytes.fromhex(
                  "ffd8ffe000104a46494600010100000100010000ffdb004300080606070605080707"
                  "070909080a0c140d0c0b0b0c1912130f141d1a1f1e1d1a1c1c20242e2720222c231c"
                  "1c2837292c30313434341f27393d38323c2e333432ffc0000b080001000101011100"
                  "ffc400140001000000000000000000000000000008ffc40014100100000000000000"
                  "0000000000000000ffda0008010100003f007fffd9"
              ))

          for n in ["cut","dice_roll","dice_six","extra_turn","forfeit","home","hop","lose","match_start","miss","no_move","tap","token_open","ui_click","win"]:
              p = f"assets/sfx/{n}.wav"
              if not os.path.isfile(p) or os.path.getsize(p) < 44: wav(p)
          for n in ["booyah_logo.png","lobby_bg.png","rank_crest.png","garena_logo.png","icon_setting.png","icon_mail.png","icon_store.png","icon_close.png","profile_stats_bg.png","icon_hide.png"]:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p): png(p, 64, 64)
          for n in ["ff_lobby_bg.jpg","ff_loading_bg.jpg","ff_login_bg.jpg","ff_hero_bg.jpg"]:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p): jpg(p)
          for n in ["dice_faces.png","dice_spritesheet.png"]:
              p = f"assets/ui/dice/{n}"
              if not os.path.isfile(p): png(p, 192, 128)
          for n in ["bar_currency.png","btn_chat.png","btn_profile_close.png","card_id.png","chip_brand.png","panel_ranked.png","tab_gallery_on.png","tab_overview.png","tab_role.png","tabs_menu_stack.png","tab_history.png","tab_honor_score.png","tab_recordings.png","tab_weapon.png","tab_wishlist.png"]:
              p = f"assets/ui/ff_profile/{n}"
              if not os.path.isfile(p): png(p, 128, 48)
          for n in ["profile_reference.png","currency_reference.png","btn_start.png","btn_store.png","btn_missions.png","btn_events.png","btn_luck_royale.png","btn_booyah_pass.png","panel_cs_ranked.png","promo_banner.png"]:
              p = f"assets/ui/ff_lobby/{n}"
              if not os.path.isfile(p): png(p, 128, 64)
          # lobby screenshot layers often referenced
          for n in ["01_profile_player_banner_transparent.png","03_top_currency_and_icons.png","05_left_event_banner_top.png","06_top_event_reward_timer_panel.png","07_store_button.png","08_luck_royale_button.png","09_booyah_pass_button.png","10_missions_button.png","11_events_button.png","12_v_goodies_panel.png","13_friends_list_panel.png","14_friends_top_event_icons.png","15_right_event_banner.png","16_cs_ranked_mode_panel.png","17_start_button.png","18_bottom_vault_weapon_preset_lab_bar.png","20_chat_and_emote_buttons.png","lobby_screenshot_no_3d_characters.png"]:
              p = f"assets/ui/user_lobby_screenshots/{n}"
              if not os.path.isfile(p): png(p, 256, 128)
          p = "assets/ui/ff_character/vault_character_close.png"
          if not os.path.isfile(p): png(p, 64, 64)
          chars = os.listdir("assets/characters") if os.path.isdir("assets/characters") else []
          if not any(f.lower().endswith(".png") for f in chars):
              png("assets/characters/Rin.png", 128, 256)
          print("placeholders ready")
          PY

      - name: Crash-safe main + pubspec dice assets
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          # Ensure dice folder is in pubspec
          if ! grep -q 'assets/ui/dice/' pubspec.yaml; then
            sed -i '/assets\/ui\/user_lobby_screenshots\//a\    - assets/ui/dice/' pubspec.yaml || true
          fi
          mkdir -p lib/core
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'core/audio.dart';
          import 'core/theme.dart';
          import 'screens/garena_splash_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            FlutterError.onError = (FlutterErrorDetails details) {
              FlutterError.presentError(details);
              debugPrint('FlutterError: ${details.exceptionAsString()}');
            };
            PlatformDispatcher.instance.onError = (error, stack) {
              debugPrint('Uncaught: $error\n$stack');
              return true;
            };
            ErrorWidget.builder = (FlutterErrorDetails details) {
              return Material(
                color: const Color(0xFF0B0E14),
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Text(
                      'UI error\n${details.exceptionAsString()}',
                      textAlign: TextAlign.center,
                      style: const TextStyle(color: Colors.white70, fontSize: 12),
                    ),
                  ),
                ),
              );
            };

            try {
              Sfx.instance.init();
            } catch (_) {}

            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            runApp(const LudoRushApp());
          }

          class LudoRushApp extends StatelessWidget {
            const LudoRushApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Ludo Rush',
                debugShowCheckedModeBanner: false,
                theme: buildAppTheme(),
                home: const GarenaSplashScreen(),
              );
            }
          }
          EOF
          # Soft-patch lobby Image.asset calls missing errorBuilder is hard; rely on ErrorWidget.
          echo "main.dart crash-safe written"
          grep -n "assets/ui/dice" pubspec.yaml || true

      - name: Soft-patch known compile issues
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          F=lib/screens/lobby_screen.dart
          if [ -f "$F" ] && grep -q "_pngDot" "$F" && ! grep -q "Widget _pngDot" "$F"; then
            sed -i "s/_pngDot(asset: 'assets\/ui\/icon_setting.png', onTap: onSettings)/_dot(icon: Icons.settings_rounded, onTap: onSettings)/g" "$F" || true
          fi
          G=lib/screens/game_screen.dart
          if [ -f "$G" ] && grep -q '_killCounterBar(pw)' "$G" && ! grep -q 'Widget _killCounterBar' "$G"; then
            sed -i '/_killCounterBar(pw)/d' "$G" || true
          fi

      - name: Regenerate android platform (bypass broken gradle)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          rm -rf android
          flutter create . --platforms=android --project-name ludo_rush --org com.myapp
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/namespace = .*/namespace = "com.myapp.mobile"/' android/app/build.gradle.kts || true
            sed -i 's/applicationId = .*/applicationId = "com.myapp.mobile"/' android/app/build.gradle.kts || true
            # Ensure minSdk not too high
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId "com.myapp.mobile"/' android/app/build.gradle || true
            sed -i 's/namespace .*/namespace "com.myapp.mobile"/' android/app/build.gradle || true
          fi
          ls -la android/app || true

      - name: Flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build universal release APK (arm64 + armv7 + x64)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          # Universal APK so 32-bit phones don't instant-crash on missing native libs
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Package APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          APK_DIR=build/app/outputs/flutter-apk
          ls -lh "$APK_DIR" || true
          APK="$APK_DIR/app-release.apk"
          [ -f "$APK" ] || APK="$APK_DIR/app-arm64-v8a-release.apk"
          [ -f "$APK" ] || { find build -name "*.apk"; exit 1; }
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/LudoRush.apk"
          ls -lh "$GITHUB_WORKSPACE/LudoRush.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-apk
          path: LudoRush.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ludo Rush APK v1.0.${{ github.run_number }}
          body: |
            Universal release APK (arm64 + armeabi-v7a + x86_64).
            Assets stripped in repo — placeholders auto-injected.
            Import real characters / sfx / ui via MT Manager after install if needed.
          files: LudoRush.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
