name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source zip
        run: |
          set -e
          Z=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -n "$Z" ]; then
            echo "Extracting $Z ..."
            rm -rf src_extracted
            mkdir -p src_extracted
            unzip -q -o "$Z" -d src_extracted
            find src_extracted -maxdepth 3 -type f | head -40
            ls -lh "$Z"
          else
            echo "No zip found — using repo root as project"
          fi

      - name: Find Flutter project folder
        id: proj
        run: |
          set -e
          P=$(find . -maxdepth 5 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml missing"
            find . -maxdepth 4 -type f | head -80
            exit 1
          fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Placeholder assets (characters / sfx / ui deleted for upload)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          mkdir -p assets/characters assets/sfx assets/ui/ff_profile assets/ui/ff_lobby assets/ui/dice assets/ui/ff_character assets/ui/user_lobby_screenshots
          python3 - <<'PY'
          import os, struct, zlib, wave

          def wav(path, ms=60):
              sr = 22050
              n = max(1, int(sr * ms / 1000))
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with wave.open(path, "w") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes(b"\x00\x00" * n)

          def png(path, w=32, h=32):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              row = b"\x00" + (b"\x1a\x1d\x22\xff" * w)
              raw = row * h
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "wb").write(data)

          def jpg(path):
              open(path, "wb").write(bytes.fromhex(
                  "ffd8ffe000104a46494600010100000100010000ffdb004300080606070605080707"
                  "070909080a0c140d0c0b0b0c1912130f141d1a1f1e1d1a1c1c20242e2720222c231c"
                  "1c2837292c30313434341f27393d38323c2e333432ffc0000b080001000101011100"
                  "ffc400140001000000000000000000000000000008ffc40014100100000000000000"
                  "0000000000000000ffda0008010100003f007fffd9"
              ))

          sfx = [
              "cut","dice_roll","dice_six","extra_turn","forfeit","home","hop",
              "lose","match_start","miss","no_move","tap","token_open","ui_click","win",
          ]
          for n in sfx:
              p = f"assets/sfx/{n}.wav"
              if not os.path.isfile(p) or os.path.getsize(p) < 44:
                  wav(p)

          ui = [
              "booyah_logo.png","lobby_bg.png","rank_crest.png","garena_logo.png",
              "icon_setting.png","icon_mail.png","icon_store.png","icon_close.png",
              "profile_stats_bg.png","icon_hide.png",
          ]
          for n in ui:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p):
                  png(p, 64, 64)

          for n in ["ff_lobby_bg.jpg","ff_loading_bg.jpg","ff_login_bg.jpg","ff_hero_bg.jpg"]:
              p = f"assets/ui/{n}"
              if not os.path.isfile(p):
                  jpg(p)

          for n in ["dice_faces.png","dice_spritesheet.png"]:
              p = f"assets/ui/dice/{n}"
              if not os.path.isfile(p):
                  png(p, 96, 64)

          ff = [
              "bar_currency.png","btn_chat.png","btn_profile_close.png","card_id.png",
              "chip_brand.png","panel_ranked.png","tab_gallery_on.png","tab_overview.png",
              "tab_role.png","tabs_menu_stack.png","tab_history.png","tab_honor_score.png",
              "tab_recordings.png","tab_weapon.png","tab_wishlist.png",
          ]
          for n in ff:
              p = f"assets/ui/ff_profile/{n}"
              if not os.path.isfile(p):
                  png(p, 128, 48)

          for n in ["profile_reference.png","currency_reference.png","btn_start.png",
                    "btn_store.png","btn_missions.png","btn_events.png","btn_luck_royale.png",
                    "btn_booyah_pass.png","panel_cs_ranked.png","promo_banner.png"]:
              p = f"assets/ui/ff_lobby/{n}"
              if not os.path.isfile(p):
                  png(p, 128, 64)

          p = "assets/ui/ff_character/vault_character_close.png"
          if not os.path.isfile(p):
              png(p, 64, 64)

          chars = os.listdir("assets/characters") if os.path.isdir("assets/characters") else []
          if not any(f.lower().endswith(".png") for f in chars):
              png("assets/characters/Rin.png", 128, 256)

          print("placeholders ready")
          PY

      - name: Soft-patch known compile issues
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          F=lib/screens/lobby_screen.dart
          if [ -f "$F" ] && grep -q "_pngDot" "$F" && ! grep -q "Widget _pngDot" "$F"; then
            sed -i "s/_pngDot(asset: 'assets\/ui\/icon_setting.png', onTap: onSettings)/_dot(icon: Icons.settings_rounded, onTap: onSettings)/g" "$F" || true
            echo "lobby _pngDot patched"
          fi
          G=lib/screens/game_screen.dart
          if [ -f "$G" ]; then
            if grep -q '_killCounterBar(pw)' "$G" && ! grep -q 'Widget _killCounterBar' "$G"; then
              sed -i '/_killCounterBar(pw)/d' "$G" || true
              echo "removed missing _killCounterBar call"
            fi
          fi

      - name: Fix Android Gradle (AGP + remove evaluationDependsOn)
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          set -e
          # Root cause of ApplicationExtension.getDefaultConfig() on Flutter 3.50:
          # subprojects { evaluationDependsOn(":app") } in build.gradle.kts
          cat > build.gradle.kts <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory =
              rootProject.layout.buildDirectory
                  .dir("../../build")
                  .get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          EOF

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-all.zip#' gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f settings.gradle.kts ]; then
            # Pin AGP 8.7.3 (stable with Flutter 3.50) and Kotlin 2.1.0
            sed -i 's#id("com.android.application") version "[^"]*"#id("com.android.application") version "8.7.3"#' settings.gradle.kts
            sed -i 's#id("org.jetbrains.kotlin.android") version "[^"]*"#id("org.jetbrains.kotlin.android") version "2.1.0"#' settings.gradle.kts
            grep -nE 'com.android.application|kotlin.android' settings.gradle.kts || true
          fi

          echo "--- build.gradle.kts ---"
          cat build.gradle.kts

      - name: Flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build arm64-v8a release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Package APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          APK_DIR=build/app/outputs/flutter-apk
          ls -lh "$APK_DIR" || true
          APK="$APK_DIR/app-arm64-v8a-release.apk"
          [ -f "$APK" ] || APK="$APK_DIR/app-release.apk"
          [ -f "$APK" ] || { find build -name "*.apk"; exit 1; }
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/LudoRush.apk"
          ls -lh "$GITHUB_WORKSPACE/LudoRush.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-apk
          path: LudoRush.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ludo Rush APK v1.0.${{ github.run_number }}
          body: |
            arm64-v8a release (assets stripped in repo).
            After install, import real characters / sfx / ui via MT Manager if needed.
          files: LudoRush.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
